name: Test CDN Assets Configuration

on:
  pull_request:
    paths:
      - 'vite.config.mts'
      - 'config/vite/**'
      - 'Dockerfile'
      - 'app/javascript/**'
      - 'spec/requests/cdn_host_spec.rb'
      - '.github/workflows/test-cdn-assets.yml'
  push:
    branches:
      - main
    paths:
      - 'vite.config.mts'
      - 'config/vite/**'
      - 'Dockerfile'
      - 'app/javascript/**'
      - 'spec/requests/cdn_host_spec.rb'

jobs:
  test-cdn-manifest:
    name: Validate CDN Asset Manifest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node.js dependencies
        run: yarn install --immutable

      - name: Build assets with test CDN_HOST
        env:
          # Deliberately trailing-slashed: resolveAssetBase must normalise this,
          # otherwise every assertion below would need to expect `//packs/`.
          CDN_HOST: https://cdn-test.example.com/
          RAILS_ENV: production
          NODE_ENV: production
          SECRET_KEY_BASE_DUMMY: '1'
        run: |
          # Build assets with CDN_HOST set
          yarn build:production

      - name: Verify Vite manifest exists and structure
        run: |
          echo "📦 Checking Vite manifest file..."

          if [ ! -f "public/packs/.vite/manifest.json" ]; then
            echo "❌ Manifest file not found"
            exit 1
          fi

          echo "✅ Manifest file exists"
          echo ""

          # Show sample manifest entries
          echo "📊 Sample manifest entries (showing how Rails will resolve CDN URLs):"
          node -e "
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('public/packs/.vite/manifest.json', 'utf8'));

          // Show first 3 entries
          Object.entries(manifest).slice(0, 3).forEach(([key, entry]) => {
            console.log('  Source:', key);
            console.log('  File:', entry.file);
            if (entry.css) console.log('  CSS:', entry.css);
            console.log('');
          });
          "

          echo "ℹ️  HOW CDN WORKS:"
          echo "   1. Manifest contains RELATIVE paths (e.g., 'assets/application-XXX.js')"
          echo "   2. Rails vite_helper reads manifest and combines paths with asset_host"
          echo "   3. If CDN_HOST is set, Rails generates: https://cdn.example.com/packs/assets/application-XXX.js"
          echo "   4. Browser loads main JS from CDN"
          echo "   5. Dynamic imports use RELATIVE paths (e.g., import('./chunk.js'))"
          echo "   6. Browser resolves relative imports relative to the CDN URL"
          echo "   7. Result: All chunks load from CDN automatically"
          echo ""

      - name: Analyze dynamic imports in generated bundles
        run: |
          echo "🔍 Analyzing how Vite handles chunk imports..."

          # Find a main application bundle (not a chunk or locale file)
          # Vite 8 / rolldown (v4.6.0) emits JS entry bundles in public/packs/ root
          # (public/packs/assets/ now holds CSS, fonts, images and emoji data only).
          js_file=$(find public/packs -maxdepth 1 -name "application-*.js" -type f ! -name "*.map" 2>/dev/null | head -1)

          if [ -z "$js_file" ]; then
            echo "❌ No application bundle found in public/packs/"
            exit 1
          fi

          echo "📄 Checking JS file: $js_file"
          echo ""

          # Look for dynamic imports in the file
          echo "🔍 Sample dynamic imports found in bundle:"
          imports=$(grep -o 'import("[^"]*"' "$js_file" | head -10 || echo "")

          if [ -z "$imports" ]; then
            echo "   (No dynamic imports found - this might be normal for small builds)"
          else
            echo "$imports"
          fi

          echo ""
          echo "📊 Understanding CDN behavior with Vite:"
          echo ""
          echo "   Vite generates RELATIVE import paths in the JavaScript bundles."
          echo "   This is intentional and works correctly with CDNs because:"
          echo ""
          echo "   1. Rails loads main bundle from CDN:"
          echo "      <script src=\"https://cdn-test.example.com/packs/assets/application-XXX.js\">"
          echo ""
          echo "   2. That bundle contains relative imports:"
          echo "      import(\"../chunk-YYY.js\")  // Goes up from assets/ to packs/"
          echo "      import(\"./other-ZZZ.js\")   // Same directory as current file"
          echo ""
          echo "   3. Browser resolves these relative to the current script's URL:"
          echo "      ../chunk-YYY.js → https://cdn-test.example.com/packs/chunk-YYY.js"
          echo "      ./other-ZZZ.js  → https://cdn-test.example.com/packs/assets/other-ZZZ.js"
          echo ""
          echo "   4. All chunks automatically load from CDN!"
          echo ""

          # Verify the file structure makes sense
          if [ -d "public/packs/assets" ] && [ -d "public/packs/intl" ]; then
            echo "✅ Build output structure verified:"
            echo "   - public/packs/assets/ (main bundles)"
            echo "   - public/packs/intl/ (locale chunks)"
            echo "   - public/packs/ (other chunks)"
            echo ""
            echo "   Relative imports will correctly navigate this structure from CDN."
          else
            echo "⚠️  Expected directory structure not found"
            echo "   This might indicate a build configuration issue"
          fi

          echo ""
          echo "✅ Dynamic import analysis complete"
          echo "   Relative paths are correct and will work with CDN via browser resolution"

      - name: Verify CSS contains absolute CDN URLs
        run: |
          echo "🔍 Verifying CSS files contain absolute CDN URLs..."
          echo ""

          # Find CSS files (excluding source maps)
          css_files=$(find public/packs -name "*.css" -type f ! -name "*.map")

          if [ -z "$css_files" ]; then
            echo "ℹ️  No CSS files found (normal for minimal builds)"
            exit 0
          fi

          echo "📄 Found CSS files:"
          echo "$css_files" | head -5
          echo ""

          # Find a CSS file that actually contains url() references (like fonts/images)
          # Not all CSS files have asset references - CSS modules often just have rules
          css_file=""
          for f in $css_files; do
            if grep -q 'url(' "$f" 2>/dev/null; then
              css_file="$f"
              break
            fi
          done

          if [ -z "$css_file" ]; then
            echo "ℹ️  No CSS files with url() references found"
            echo "   This can happen if styles don't reference fonts/images"
            echo "   Skipping CSS CDN URL verification"
            exit 0
          fi

          echo "📊 Checking for absolute CDN URLs in: $css_file"
          echo ""

          # CRITICAL TEST: CSS should contain ABSOLUTE CDN URLs (not relative paths)
          # This is different from JavaScript which uses relative imports
          cdn_urls=$(grep -o 'url(https://cdn-test.example.com/packs/[^)]*' "$css_file" 2>/dev/null || echo "")

          if [ -z "$cdn_urls" ]; then
            echo "❌ FAILED: CSS does not contain absolute CDN URLs!"
            echo ""
            echo "Expected to find URLs like:"
            echo "   url(https://cdn-test.example.com/packs/assets/roboto-bold.woff2)"
            echo ""
            echo "Sample of what was actually found:"
            grep -o 'url([^)]*' "$css_file" | head -5 || echo "   (no url() references found)"
            echo ""
            echo "This indicates CDN_HOST is not being used by Vite to inject absolute URLs into CSS."
            exit 1
          fi

          echo "✅ SUCCESS: Found absolute CDN URLs in CSS!"
          echo ""
          echo "📊 Sample CDN URLs found (first 5):"
          echo "$cdn_urls" | head -5
          echo ""
          echo "ℹ️  How CSS CDN works (different from JavaScript):"
          echo "   - Vite's 'base' config injects ABSOLUTE CDN URLs into CSS at build-time"
          echo "   - Fonts/images referenced in CSS load directly from CDN"
          echo "   - No runtime resolution needed - URLs are hardcoded in CSS"
          echo "   - JavaScript uses RELATIVE paths (browser resolves at runtime)"
          echo ""
          echo "✅ CSS CDN verification complete"

      - name: Verify emoji locale data uses CDN URLs
        run: |
          echo "🔍 Verifying emoji locale data (emojibase) uses CDN URLs..."
          echo ""

          # After upstream merge (caffb0fd6), emoji loader uses import.meta.glob to load
          # emojibase data files. These should appear in Vite manifest with CDN URLs.

          # Find emojibase compact.json files in the built assets
          emoji_files=$(find public/packs/assets -name "*compact*.json" 2>/dev/null | head -5 || echo "")

          if [ -z "$emoji_files" ]; then
            echo "ℹ️  No emojibase compact.json files found in public/packs/assets/"
            echo "   This is expected if import.meta.glob with query: '?url' returns"
            echo "   URLs from node_modules without copying files to public/packs"
            echo ""
            echo "   Checking Vite manifest for emojibase references..."

            # Check if manifest references emojibase data
            emoji_in_manifest=$(grep -o "emojibase-data.*compact\.json" public/packs/.vite/manifest.json 2>/dev/null || echo "")

            if [ -z "$emoji_in_manifest" ]; then
              echo "   ℹ️  No emojibase references in manifest"
              echo "   Emoji data is likely loaded via dynamic imports from node_modules"
            else
              echo "   ✅ Found emojibase references in manifest:"
              echo "$emoji_in_manifest" | head -3
            fi
          else
            echo "📄 Found emojibase files in public/packs/assets:"
            echo "$emoji_files"
            echo ""
            echo "✅ Emoji locale data is processed by Vite"
          fi

          echo ""
          echo "ℹ️  Emoji system after upstream merge (caffb0fd6):"
          echo "   - loader.ts uses import.meta.glob with query: '?url'"
          echo "   - Returns CDN-aware URLs for emojibase data"
          echo "   - Worker receives path parameter with full CDN URL"
          echo "   - No hardcoded /packs/emoji/ paths (removed in upstream fix)"
          echo ""
          echo "✅ Emoji locale data CDN verification complete"

      - name: Verify Vite-processed image assets in manifest
        run: |
          echo "🔍 Verifying Vite-processed image assets use CDN..."
          echo ""

          # Check for key image assets in the Vite manifest
          # These are imported in JavaScript and should be processed by Vite

          manifest_file="public/packs/.vite/manifest.json"

          if [ ! -f "$manifest_file" ]; then
            echo "❌ Manifest file not found: $manifest_file"
            exit 1
          fi

          echo "📊 Checking for image assets in Vite manifest..."

          # Look for common image assets that should be in manifest
          image_assets=$(grep -o '"[^"]*\.\(svg\|png\|jpg\|webp\)"' "$manifest_file" | head -10 || echo "")

          if [ -z "$image_assets" ]; then
            echo "ℹ️  No image assets found in manifest"
            echo "   Images may be referenced via Rails helpers or served from public/"
          else
            echo "✅ Found image assets in manifest (sample):"
            echo "$image_assets" | head -5
            echo ""
            echo "   These assets will use CDN URLs when accessed via:"
            echo "   - Rails: vite_asset_path() helper"
            echo "   - JavaScript: import statements"
          fi

          echo ""
          echo "✅ Vite image asset verification complete"

      - name: Document public directory asset limitations
        run: |
          echo "📋 PUBLIC DIRECTORY ASSET CDN STATUS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "The following assets are in public/ and have LIMITATIONS with CDN:"
          echo ""

          echo "❌ HARDCODED PATHS (Won't use CDN without code changes):"
          echo "   • /badge.png - Service worker notification badge"
          echo "   • /oops.png, /oops.gif - Error page images"
          echo "   • /web-push-icon_*.png - Web push notification icons"
          echo "   • /loading.png - Loading indicator"
          echo ""
          echo "   Files with hardcoded paths:"
          echo "   - app/javascript/mastodon/service_worker/web_push_notifications.js"
          echo "   - app/javascript/entrypoints/error.ts"
          echo "   - app/javascript/mastodon/features/ui/components/bundle_column_error.jsx"
          echo ""

          echo "✅ RAILS-SERVED ASSETS (Will use CDN via Rails asset_host):"
          echo "   • /emoji/*.svg - 3000+ emoji SVG files"
          echo "   • Any assets referenced via Rails image_tag() helper"
          echo "   • Assets accessed through Rails controllers"
          echo ""

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "💡 TO FIX HARDCODED PATHS:"
          echo "   1. Move assets to app/javascript/images/"
          echo "   2. Import in JavaScript: import badgeIcon from '../images/badge.png'"
          echo "   3. Vite will process and add to manifest with CDN URLs"
          echo ""
          echo "   OR use Rails helpers in server-rendered HTML:"
          echo "   <%= image_tag(frontend_asset_path('images/badge.png')) %>"
          echo ""
          echo "✅ Public directory documentation complete"

      # NOTE: Emoji handling in Vite builds (UPDATED after upstream merge caffb0fd6)
      # - Emoji LOCALE DATA (emojibase compact.json): Loaded via import.meta.glob with query: '?url'
      #   Returns CDN-aware URLs. Worker receives path parameter with full URL.
      # - Emoji SVG source files: Live in public/emoji/ and are served statically by Rails/Nginx
      # - Custom emoji data (emoji_map.json): May be embedded in bundles or loaded separately

      - name: Verify the build records the CDN host it was compiled against
        run: |
          echo "🔍 Checking public/packs/.vite/asset-base.json..."

          # The running app compares this against its own CDN_HOST to detect a
          # container built for one CDN but deployed with another. Nothing else
          # in the build output carries the value: Vite's manifest stores output
          # paths, not URLs, so it looks identical with and without a CDN.
          recorded="public/packs/.vite/asset-base.json"

          if [ ! -f "$recorded" ]; then
            echo "❌ $recorded was not emitted."
            echo "   RecordAssetBase() in config/vite/asset-base.ts should emit it."
            exit 1
          fi

          cat "$recorded"

          node -e "
          const recorded = require('./public/packs/.vite/asset-base.json');
          const expected = 'https://cdn-test.example.com';

          if (recorded.cdnHost !== expected) {
            console.error('❌ cdnHost was ' + JSON.stringify(recorded.cdnHost) + ', expected ' + expected);
            console.error('   CDN_HOST was trailing-slashed for this job; it must be recorded normalised,');
            console.error('   or the runtime mismatch check will fire on every boot.');
            process.exit(1);
          }
          if (!recorded.base.startsWith(expected + '/packs/')) {
            console.error('❌ base was ' + JSON.stringify(recorded.base));
            process.exit(1);
          }
          console.log('✅ Recorded base: ' + recorded.base);
          "

      - name: Verify CDN_HOST trailing slash is normalised
        run: |
          echo "🔍 Checking that a trailing-slashed CDN_HOST did not produce '//packs/'..."

          # CDN_HOST is set to 'https://cdn-test.example.com/' for this job. Vite
          # concatenates `base` with asset paths, so without normalisation every
          # emitted URL would carry a doubled slash. Most CDNs still serve those,
          # which is why this went unnoticed -- but it breaks cache keys and any
          # exact-match origin rule.
          offenders=$(grep -rho 'https://cdn-test\.example\.com//*[a-zA-Z0-9_-]*' \
            public/packs/.vite/manifest.json public/packs 2>/dev/null \
            | grep '//packs' | sort -u || true)

          if [ -n "$offenders" ]; then
            echo "❌ Found doubled slashes after the CDN host:"
            echo "$offenders"
            echo ""
            echo "resolveAssetBase() in config/vite/asset-base.ts should strip"
            echo "trailing slashes from CDN_HOST before joining the output dir."
            exit 1
          fi

          echo "✅ CDN_HOST trailing slash normalised correctly"

      - name: Check for hardcoded /packs/ paths in TypeScript
        run: |
          echo "🔍 Scanning for hardcoded /packs/ paths in JavaScript/TypeScript..."

          # Look for hardcoded paths (excluding legitimate cases)
          # Exclude:
          # - import.meta.env.DEV checks (used for dev vs prod paths)
          # - Comments
          # - Test files

          if grep -r "'/packs/" app/javascript \
             --include="*.ts" \
             --include="*.tsx" \
             --include="*.js" \
             --include="*.jsx" \
             --exclude-dir="__tests__" \
             --exclude-dir="__mocks__" \
             | grep -v "import.meta.env.DEV" \
             | grep -v "packs-dev" \
             | grep -v "packs-test" \
             | grep -v "\/\/" \
             | grep -v "\/\*"; then
            echo "❌ Found hardcoded /packs/ paths"
            echo "💡 These should use CDN-aware URL construction"
            exit 1
          fi

          echo "✅ No hardcoded /packs/ paths found"

      - name: Verify build without CDN_HOST still works
        run: |
          echo "🔍 Testing build without CDN_HOST (backward compatibility)..."

          # Clean previous build
          rm -rf public/packs

          # Build without CDN_HOST
          SECRET_KEY_BASE_DUMMY=1 \
          RAILS_ENV=production \
          NODE_ENV=production \
          yarn build:production

          # Verify manifest exists and has relative paths (not absolute CDN URLs)
          node -e "
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('public/packs/.vite/manifest.json', 'utf8'));

          let hasAbsoluteUrls = false;
          for (const [key, entry] of Object.entries(manifest)) {
            if (entry.file && entry.file.startsWith('http')) {
              hasAbsoluteUrls = true;
              console.error('❌ Found absolute URL in manifest without CDN_HOST:', entry.file);
              break;
            }
          }

          if (hasAbsoluteUrls) {
            console.error('❌ Build without CDN_HOST should produce relative paths, not absolute URLs');
            process.exit(1);
          }

          console.log('✅ Build without CDN_HOST works correctly (backward compatible)');
          "

      - name: Summary
        if: success()
        run: |
          echo "
          ✅ All CDN asset tests passed!

          Tests completed:
          - ✅ Vite manifest exists with relative paths (ready for Rails CDN resolution)
          - ✅ Dynamic imports use relative paths (browser will resolve from CDN)
          - ✅ CSS contains ABSOLUTE CDN URLs for fonts/images (critical verification!)
          - ✅ Emoji locale data (emojibase) uses CDN-aware URLs via import.meta.glob
          - ✅ Vite-processed image assets verified in manifest
          - ✅ Public directory asset limitations documented
          - ✅ No hardcoded /packs/ paths in TypeScript source
          - ✅ Backward compatibility maintained (build without CDN_HOST works)

          How CDN works (Two-Mechanism Approach):

          Mechanism 1 - CSS Assets (Build-Time):
          - Vite's 'base' config injects ABSOLUTE CDN URLs into CSS files
          - Example: url(https://cdn.example.com/packs/assets/roboto.woff2)
          - Fonts/images load directly from CDN - no runtime resolution needed

          Mechanism 2 - JavaScript & Manifest (Runtime):
          - Manifest contains relative paths (e.g., 'assets/application.js')
          - Rails combines with config.asset_host to generate CDN URLs
          - JavaScript bundles contain relative imports (e.g., import('../chunk.js'))
          - Browser resolves relative imports from the script's CDN location

          Emoji System (After Upstream Merge caffb0fd6):
          - Uses import.meta.glob with query: '?url' for emojibase locale data
          - Returns CDN-aware URLs automatically
          - No more hardcoded /packs/emoji/ paths

          Known Limitations:
          - Public directory assets with hardcoded JS paths won't use CDN
          - Service worker icons (/badge.png, /web-push-icon_*.png) need refactoring
          - These can be fixed by moving to Vite pipeline or using Rails helpers

          Result: All Vite-managed assets load from CDN automatically ✨
          "

  test-cdn-image:
    name: Verify CDN_HOST end to end in a built image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # CDN_HOST is consumed at two points that cannot see each other: Vite bakes
      # it into compiled CSS during asset precompilation, and the ENV block makes
      # it available to Rails at boot for asset_host, the CSP allow-list and the
      # <meta name="cdn-host"> tag. The original defect was the ENV half missing
      # while the asset half worked, which no job checking one half alone would
      # have caught.
      #
      # So this builds the whole image rather than a stage, and asserts both
      # halves in the same artifact. It is the slowest job here; the GitHub
      # Actions cache keeps repeat runs to the layers that actually changed.
      #
      # The value is deliberately trailing-slashed: the recorded host must come
      # back normalised while the raw value still reaches the runtime ENV, where
      # Rails normalises on read.
      - name: Build the full image with a CDN_HOST build arg
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          build-args: |
            CDN_HOST=https://cdn-test.example.com/
          push: false
          load: true
          tags: peachy-cdn-e2e:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert the runtime environment carries CDN_HOST
        run: |
          echo "🔍 Inspecting the runtime environment of the built image..."

          env_value=$(docker image inspect peachy-cdn-e2e:latest \
            --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep '^CDN_HOST=' || true)

          if [ -z "$env_value" ]; then
            echo "❌ CDN_HOST is not present in the image environment."
            echo ""
            echo "The Dockerfile consumed CDN_HOST at build time but never promoted"
            echo "it to a runtime ENV. Rails reads ENV['CDN_HOST'] at boot to set"
            echo "config.asset_host, which drives the CSP allow-list and the"
            echo "<meta name=\"cdn-host\"> tag. Without it the CDN is only half"
            echo "applied and the browser blocks the assets the build redirected."
            echo ""
            echo "Fix: add CDN_HOST=\"\${CDN_HOST}\" to the ENV block in Dockerfile."
            exit 1
          fi

          echo "   $env_value"
          echo "✅ CDN_HOST reaches the container runtime"

      - name: Assert the build recorded the CDN host, normalised
        run: |
          echo "🔍 Reading the recorded asset base out of the image..."

          docker run --rm --entrypoint cat peachy-cdn-e2e:latest \
            /opt/mastodon/public/packs/.vite/asset-base.json > asset-base.json

          cat asset-base.json

          node -e "
          const recorded = require('./asset-base.json');
          const expected = 'https://cdn-test.example.com';

          // CdnHostCheck compares this against the running CDN_HOST. If the two
          // normalise differently the app reports a host as mismatching itself
          // on every boot.
          if (recorded.cdnHost !== expected) {
            console.error('❌ cdnHost was ' + JSON.stringify(recorded.cdnHost) + ', expected ' + expected);
            process.exit(1);
          }
          if (recorded.base !== expected + '/packs/') {
            console.error('❌ base was ' + JSON.stringify(recorded.base));
            process.exit(1);
          }
          console.log('✅ Recorded base: ' + recorded.base);
          "

      - name: Assert compiled CSS points at the CDN
        run: |
          echo "🔍 Checking compiled CSS inside the image for CDN URLs..."

          # The asset half of CDN_HOST. Unlike JS, which resolves relative to
          # import.meta.url at runtime, CSS url() values are absolute and fixed
          # at build time, so this is what actually proves the base was applied.
          found=$(docker run --rm --entrypoint sh peachy-cdn-e2e:latest -c \
            "grep -rhoE 'url\(https://cdn-test\.example\.com/packs/[^)]*' \
               /opt/mastodon/public/packs --include='*.css' 2>/dev/null | head -3" || true)

          if [ -z "$found" ]; then
            echo "❌ No CDN URLs found in compiled CSS."
            echo "   resolveAssetBase() did not reach the asset build, so styles"
            echo "   and fonts would be fetched from the origin instead."
            exit 1
          fi

          echo "$found"

          if docker run --rm --entrypoint sh peachy-cdn-e2e:latest -c \
            "grep -rq 'cdn-test\.example\.com//packs' /opt/mastodon/public/packs --include='*.css' 2>/dev/null"; then
            echo "❌ Found a doubled slash after the CDN host in compiled CSS."
            exit 1
          fi

          echo "✅ Compiled CSS points at the CDN, with no doubled slash"

      - name: Assert an unset CDN_HOST stays empty
        run: |
          echo "🔍 Verifying backward compatibility (no CDN_HOST build arg)..."

          # Only the `ruby` stage: the ENV block lives there, and the negative
          # case needs no assets, so there is nothing to gain from a full build.
          docker build --target ruby -t peachy-cdn-default:latest . >/dev/null

          env_value=$(docker image inspect peachy-cdn-default:latest \
            --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep '^CDN_HOST=' || true)

          # The ARG defaults to "", so the key may be present but must be empty;
          # Rails treats a blank value as "no CDN" via `.present?`.
          if [ -n "$env_value" ] && [ "$env_value" != "CDN_HOST=" ]; then
            echo "❌ Expected an empty CDN_HOST, got: $env_value"
            exit 1
          fi

          echo "✅ Builds without CDN_HOST leave it unset"

  test-cdn-booted-app:
    name: Verify CDN_HOST against a booted app
    runs-on: ubuntu-latest

    # The only place the Content-Security-Policy can actually be checked.
    # config/initializers/content_security_policy.rb reads assets_host into a
    # local at boot and the policy block closes over it, so Rails builds one
    # static policy per process. A request spec cannot vary it -- the value is
    # already fixed by the time any example runs. Booting a container with
    # CDN_HOST set is the only way to observe the CDN reaching script-src.
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10ms
          --health-timeout 3s
          --health-retries 50
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10ms
          --health-timeout 3s
          --health-retries 50
        ports:
          - 6379:6379

    env:
      CDN_ORIGIN: http://127.0.0.1:8080
      APP_ORIGIN: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the image against the stand-in CDN origin
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          build-args: |
            CDN_HOST=${{ env.CDN_ORIGIN }}
          push: false
          load: true
          tags: peachy-cdn-boot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Serve the built assets as a stand-in CDN
        run: |
          # Assets are served from a *different origin* than the app, which is
          # the whole point: it is what makes the CSP, the meta tag and the
          # emitted asset URLs meaningful rather than incidentally same-origin.
          container=$(docker create peachy-cdn-boot:latest)
          docker cp "$container:/opt/mastodon/public" ./cdn-root
          docker rm "$container" >/dev/null

          test -d ./cdn-root/packs || { echo "❌ no packs directory in the image"; exit 1; }

          # http.server sends no CORS headers, and the service worker is a module
          # worker whose chunk imports are CORS-fetched, so a plain static server
          # would not reproduce a usable CDN.
          cat > cdn_server.py <<'PY'
          import functools, http.server, socketserver

          class Handler(http.server.SimpleHTTPRequestHandler):
              def end_headers(self):
                  self.send_header('Access-Control-Allow-Origin', '*')
                  self.send_header('Cross-Origin-Resource-Policy', 'cross-origin')
                  super().end_headers()

          socketserver.TCPServer.allow_reuse_address = True
          handler = functools.partial(Handler, directory='cdn-root')
          with socketserver.ThreadingTCPServer(('127.0.0.1', 8080), handler) as httpd:
              httpd.serve_forever()
          PY

          nohup python3 cdn_server.py > cdn-server.log 2>&1 &

          for _ in $(seq 1 30); do
            if curl -sf "$CDN_ORIGIN/packs/.vite/asset-base.json" >/dev/null; then
              echo "✅ CDN serving on $CDN_ORIGIN"
              curl -s "$CDN_ORIGIN/packs/.vite/asset-base.json"
              exit 0
            fi
            sleep 1
          done

          echo "❌ stand-in CDN never came up"
          cat cdn-server.log
          exit 1

      - name: Generate throwaway runtime secrets
        run: |
          # Required by config/initializers/active_record_encryption.rb, which
          # aborts boot when they are absent. Generated per run and never reused.
          {
            echo "SECRET_KEY_BASE=$(openssl rand -hex 64)"
            echo "OTP_SECRET=$(openssl rand -hex 64)"
            echo "ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=$(openssl rand -hex 32)"
            echo "ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=$(openssl rand -hex 32)"
            echo "ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=$(openssl rand -hex 32)"
          } > app.env

          {
            echo "RAILS_ENV=production"
            # Must match the port curl reaches below: config.hosts is built
            # from this, and a mismatch is a 403 rather than anything CDN-related.
            echo "LOCAL_DOMAIN=127.0.0.1:3000"
            echo "DB_HOST=127.0.0.1"
            echo "DB_USER=postgres"
            echo "DB_PASS=postgres"
            echo "DB_NAME=mastodon_production"
            echo "REDIS_URL=redis://127.0.0.1:6379"
            echo "RAILS_SERVE_STATIC_FILES=true"
          } >> app.env

      - name: Prepare the database
        run: |
          docker run --rm --network host --env-file app.env \
            -e CDN_HOST="$CDN_ORIGIN" \
            peachy-cdn-boot:latest \
            bundle exec rails db:prepare

      - name: Boot the app
        run: |
          docker run -d --name peachy-app --network host --env-file app.env \
            -e CDN_HOST="$CDN_ORIGIN" \
            peachy-cdn-boot:latest \
            bundle exec puma -C config/puma.rb

          for _ in $(seq 1 60); do
            if curl -sf "$APP_ORIGIN/health" | grep -q 'OK'; then
              echo "✅ app healthy"
              exit 0
            fi
            sleep 2
          done

          echo "❌ app never became healthy"
          exit 1

      - name: Assert the page advertises the CDN
        run: |
          # Two things this request has to get right, both of which fail in ways
          # that look unrelated to the CDN:
          #
          # X-Forwarded-Proto: production sets config.force_ssl = true
          # unconditionally, and config.ssl_options excludes only /health from the
          # redirect. So the health poll above succeeds while a plain GET / returns
          # 301 and yields no HTML at all. Real deployments sit behind a
          # TLS-terminating proxy; this header is how the harness stands in for one.
          #
          # Host: config/initializers/1_hosts.rb builds config.hosts from
          # LOCAL_DOMAIN, so the port reached here must match the LOCAL_DOMAIN set
          # for the container, or Rails host authorization returns 403 before any
          # of this is exercised. Both are pinned to 3000.
          curl -sS -H 'X-Forwarded-Proto: https' "$APP_ORIGIN/" -o page.html -D headers.txt

          if ! head -1 headers.txt | grep -q ' 200'; then
            echo "❌ GET / did not return 200"
            head -1 headers.txt
            exit 1
          fi

          if ! grep -qF "content=\"$CDN_ORIGIN\"" page.html; then
            echo "❌ <meta name=\"cdn-host\"> missing or wrong"
            grep -i 'cdn-host' page.html || echo "   (no cdn-host meta tag at all)"
            exit 1
          fi
          echo "✅ meta cdn-host present"

      - name: Assert the CSP allows the CDN
        run: |
          csp=$(grep -i '^content-security-policy:' headers.txt || true)

          if [ -z "$csp" ]; then
            echo "❌ no Content-Security-Policy header"
            exit 1
          fi

          for directive in script-src style-src font-src; do
            value=$(printf '%s' "$csp" | tr ';' '\n' | grep " *$directive " || true)
            case "$value" in
              *"$CDN_ORIGIN"*) echo "✅ $directive allows the CDN" ;;
              *)
                echo "❌ $directive does not allow $CDN_ORIGIN"
                echo "   $value"
                echo ""
                echo "Rails booted without CDN_HOST reaching config.asset_host, so the"
                echo "browser would block the assets the build pointed at the CDN."
                exit 1
                ;;
            esac
          done

      - name: Assert referenced assets actually load from the CDN
        run: |
          # The end-to-end claim: not "the string appears in a file" but "the page
          # points at the CDN and the CDN serves it".
          urls=$(grep -oE "$CDN_ORIGIN/packs/[^\"']+" page.html | sort -u | head -5)

          if [ -z "$urls" ]; then
            echo "❌ the page references no CDN asset URLs"
            exit 1
          fi

          for url in $urls; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            acao=$(curl -sI "$url" | grep -i '^access-control-allow-origin:' || true)

            if [ "$code" != "200" ]; then
              echo "❌ $url returned $code"
              exit 1
            fi
            if [ -z "$acao" ]; then
              echo "❌ $url is served without Access-Control-Allow-Origin"
              echo "   The service worker is a module worker; its chunk imports are"
              echo "   CORS-fetched, so it would fail to install against this CDN."
              exit 1
            fi
            echo "  200 + CORS  $url"
          done
          echo "✅ referenced assets load from the CDN with CORS"

      - name: Assert a mismatched CDN_HOST is reported at boot
        run: |
          # The image was compiled against $CDN_ORIGIN. Booting it with a
          # different value is the skew CdnHostCheck exists to catch, and is
          # exactly what happens when CDN_HOST is changed at deploy time without
          # rebuilding.
          docker run --rm --network host --env-file app.env \
            -e CDN_HOST=http://127.0.0.1:9999 \
            peachy-cdn-boot:latest \
            bundle exec rails runner 'puts CdnHostCheck.new.warnings' > mismatch.log 2>&1 || true

          cat mismatch.log

          if ! grep -q 'built against' mismatch.log; then
            echo "❌ no mismatch warning for a CDN_HOST the assets were not built with"
            exit 1
          fi
          echo "✅ mismatch reported"

      - name: Container logs
        if: always()
        run: |
          echo "===== app ====="
          docker logs peachy-app 2>&1 | tail -80 || true
          echo "===== cdn ====="
          tail -40 cdn-server.log || true
